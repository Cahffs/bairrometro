# Fontes de dados aprovadas e os arquivos que o coletor baixa.
# Checagem legal e de custo de cada uma em contexto/fontes.md.
#
# Marcadores trocados pela configuração da cidade (config/cidades/*.toml):
#   {uf}               sigla do estado (ex.: SP)
#   {geofabrik_regiao} região do extrato do OpenStreetMap

[ibge_censo2022]
nome = "IBGE — Censo Demográfico 2022"
abrangencia = "nacional"
credito = "Fonte: IBGE, Censo Demográfico 2022"
arquivos = [
  # malha de bairros (Brasil) e de setores censitários (por estado)
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/bairros/gpkg/BR/BR_bairros_CD2022.gpkg",
  "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_de_setores_censitarios__divisoes_intramunicipais/censo_2022/setores/gpkg/UF/{uf}/{uf}_setores_CD2022.gpkg",
  # agregados por bairro: básico (população), domicílio (saneamento) e entorno (calçada, arborização, iluminação)
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Bairro_csv/Agregados_por_bairros_basico_BR_20260520.zip",
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Bairro_csv/Agregados_por_bairros_caracteristicas_domicilio1_BR_20261021.zip",
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios_Caracteristicas_urbanisticas_do_entorno_dos_domicilios/Agregados_por_Bairro_csv/Agregados_por_bairros_entorno_domic%c3%adlios_BR.zip",
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios_Caracteristicas_urbanisticas_do_entorno_dos_domicilios/Agregados_por_Bairro_csv/Agregados_por_bairros_entorno_faces_BR.zip",
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios_Caracteristicas_urbanisticas_do_entorno_dos_domicilios/Agregados_por_Bairro_csv/Agregados_por_bairros_entorno_moradores_BR.zip",
  # agregados por setor: básico (V0001 pessoas), domicílio parte 1 (V00001 domicílios ocupados),
  # parte 2 (água V00111, esgoto V00309, lixo V00397/V00398) e entorno (calçada, arborização, iluminação)
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv/Agregados_por_setores_basico_BR_20260520.zip",
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv/Agregados_por_setores_caracteristicas_domicilio1_BR_20261021.zip",
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv/Agregados_por_setores_caracteristicas_domicilio2_BR_20250417.zip",
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios_Caracteristicas_urbanisticas_do_entorno_dos_domicilios/Agregados_por_Setor_csv/Agregados_por_setores_entorno_domic%c3%adlios_BR.zip",
  # dicionário de dados (explica cada coluna)
  "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/dicionario_de_dados_agregados_por_setores_censitarios_20260520.xlsx",
]

[osm_geofabrik]
nome = "OpenStreetMap (extrato da Geofabrik)"
abrangencia = "global"
credito = "© OpenStreetMap contributors (ODbL)"
arquivos = [
  "https://download.geofabrik.de/{geofabrik_regiao}-latest.osm.pbf",
]

[ssp_sp_criminais]
nome = "SSP-SP — Dados criminais"
abrangencia = "estadual"
uf = "SP"
credito = "Fonte: Secretaria da Segurança Pública de SP"
arquivos = [
  "https://www.ssp.sp.gov.br/assets/estatistica/transparencia/spDados/SPDadosCriminais_2024.xlsx",
  "https://www.ssp.sp.gov.br/assets/estatistica/transparencia/spDados/SPDadosCriminais_2025.xlsx",
]
# Naturezas que entram no critério Segurança (D033): crimes contra a pessoa e o patrimônio.
# Ficam de fora: acidentes de trânsito (já pesam em Sossego), entorpecentes e porte de arma
# (medem mais a atividade da polícia do que o risco de quem mora) e crimes sexuais
# (a SSP não publica o local, para proteger a vítima; não tentamos localizá-los).
# Os nomes são os do campo NATUREZA_APURADA da SSP-SP; outro estado terá a sua própria lista.
naturezas_seguranca = [
  "FURTO - OUTROS",
  "FURTO DE VEÍCULO",
  "FURTO DE CARGA",
  "ROUBO - OUTROS",
  "ROUBO DE VEÍCULO",
  "ROUBO DE CARGA",
  "LESÃO CORPORAL DOLOSA",
  "LESÃO CORPORAL SEGUIDA DE MORTE",
  "HOMICÍDIO DOLOSO",
  "TENTATIVA DE HOMICÍDIO",
  "LATROCÍNIO",
  "EXTORSÃO MEDIANTE SEQUESTRO",
]

[cnes_estabelecimentos]
nome = "Ministério da Saúde — CNES, estabelecimentos de saúde"
abrangencia = "nacional"
credito = "Fonte: Ministério da Saúde, Cadastro Nacional de Estabelecimentos de Saúde (CNES)"
arquivos = [
  # publicado pelo Portal de Dados Abertos do SUS; o arquivo fica no armazenamento do Ministério (S3)
  "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/CNES/cnes_estabelecimentos_csv.zip",
]
# Tipos de estabelecimento que contam em Saúde (D037), pela tabela de tipos do CNES:
# 1 posto de saúde, 2 centro de saúde/UBS, 4 policlínica, 5 hospital geral, 7 hospital especializado,
# 15 unidade mista, 20 pronto-socorro geral, 21 pronto-socorro especializado,
# 36 clínica/ambulatório especializado, 61 centro de parto normal, 62 hospital-dia, 70 CAPS,
# 71 centro de apoio à saúde da família, 72 atenção à saúde indígena, 73 pronto atendimento.
# Ficam de fora: 22 consultório isolado (registro de profissional autônomo, com dados pessoais),
# farmácias, laboratórios e apoio diagnóstico, unidades móveis e unidades administrativas.
tipos_unidade = [1, 2, 4, 5, 7, 15, 20, 21, 36, 61, 62, 70, 71, 72, 73]

[inep_censo_escolar]
nome = "INEP — Microdados do Censo Escolar da Educação Básica"
abrangencia = "nacional"
credito = "Fonte: INEP, Censo Escolar da Educação Básica"
arquivos = [
  # não traz coordenadas: as escolas são localizadas com os dados do OpenStreetMap (D039)
  "https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2024.zip",
]
