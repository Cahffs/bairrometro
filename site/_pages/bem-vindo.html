<!doctype html>
<html lang="pt-BR">
<head>
<!--#include head-->
<title>Bem-vindo · Bairrômetro</title>
<meta name="robots" content="noindex">
<script type="module" src="assets/js/bem-vindo.js"></script>
</head>
<body>
<!--#include header-->
<main id="conteudo" class="onb">
  <p id="status" role="status" hidden></p>
  <div class="onb-split" id="onboarding" hidden>
    <section class="onb-panel">
      <ol class="onb-steps" id="steps" aria-label="Etapas"></ol>
      <p class="onb-greeting" id="greeting"></p>
      <p class="onb-count" id="step-count"></p>
      <h1 class="onb-title" id="step-title"></h1>
      <p class="onb-help" id="step-help"></p>
      <div class="onb-now" id="preview" aria-live="polite"></div>
    </section>
    <section class="onb-side">
      <div id="step"></div>
      <div class="onb-actions">
        <button class="btn-link" id="back" type="button">← Voltar</button>
        <button class="btn btn-pick btn-lg" id="next" type="button">Continuar</button>
      </div>
      <p class="onb-kbd" id="kbd-hint">Atalhos: <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> para escolher, <kbd>Enter</kbd> para continuar</p>
      <p class="onb-skip"><a href="explorar.html">Pular e ver todos os bairros</a></p>
    </section>
  </div>
</main>
<!--#include footer-->
</body>
</html>
